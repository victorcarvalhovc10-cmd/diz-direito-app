<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diz Direito — assistente de projetos com IA</title>
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A0B14">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg: #0A0B14;
    --panel: rgba(255,255,255,0.045);
    --panel-border: rgba(255,255,255,0.09);
    --ink: #EDEBF7;
    --ink-soft: #9491AD;
    --violet: #8B5CF6;
    --cyan: #22D3EE;
    --pink: #F472B6;
    --grad: linear-gradient(120deg, var(--violet), var(--cyan));
  }
  *{ box-sizing: border-box; }
  html, body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, rgba(139,92,246,0.16), transparent 45%),
      radial-gradient(circle at 85% 20%, rgba(34,211,238,0.12), transparent 40%),
      var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    display:flex;
    justify-content:center;
  }

  .app{ width:100%; max-width: 640px; display:flex; flex-direction:column; height:100vh; }

  .brand{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--panel-border);
    flex-shrink:0;
  }
  .brand img{ height:38px; width:auto; }
  .new-chat-btn{
    font-family:'JetBrains Mono', monospace; font-size:12px;
    background: none; border: 1px solid var(--panel-border); color: var(--ink-soft);
    padding: 7px 12px; border-radius: 100px; cursor:pointer;
  }
  .new-chat-btn:hover{ border-color: var(--violet); color: var(--ink); }
  .subscribe-btn{
    background: transparent; color: var(--ink-soft); border: 1px solid var(--panel-border);
    padding: 7px 12px; border-radius: 100px; font-family:'JetBrains Mono', monospace;
    font-weight: 500; font-size: 11.5px; cursor: pointer; transition: all .15s ease;
  }
  .subscribe-btn:hover{ border-color: var(--violet); color: var(--ink); }
  .subscribe-active{
    background: linear-gradient(120deg, #22C55E, #16A34A) !important;
    color: #fff !important; border-color: transparent !important;
  }
  .brand-actions{ display:flex; align-items:center; gap:8px; }

  .chat-log{
    flex:1; overflow-y:auto; padding: 18px 16px 8px;
    display:flex; flex-direction:column; gap:16px;
  }

  .msg-row{ display:flex; gap:10px; align-items:flex-start; max-width:100%; }
  .msg-row.user{ flex-direction:row-reverse; }
  .avatar{ width:32px; height:32px; border-radius:50%; object-fit:cover; flex-shrink:0; margin-top:2px; }
  .bubble{
    background: var(--panel); border:1px solid var(--panel-border);
    border-radius: 14px; padding: 12px 14px; font-size:14.5px; line-height:1.55;
    max-width: 82%;
  }
  .msg-row.user .bubble{
    background: linear-gradient(120deg, rgba(139,92,246,0.22), rgba(34,211,238,0.14));
    border-color: rgba(139,92,246,0.4);
  }
  .bubble.wide{ max-width:100%; width:100%; }

  .typing{ display:flex; gap:4px; padding:4px 0; }
  .typing span{ width:6px; height:6px; border-radius:50%; background: var(--ink-soft); animation: bounce 1.2s infinite ease-in-out; }
  .typing span:nth-child(2){ animation-delay:0.15s; }
  .typing span:nth-child(3){ animation-delay:0.3s; }
  @keyframes bounce{ 0%,60%,100%{ transform:translateY(0); opacity:.5; } 30%{ transform:translateY(-4px); opacity:1; } }

  .opt-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:10px; }
  .opt{
    display:flex; align-items:center; gap:9px;
    padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--panel-border); background: rgba(255,255,255,0.03);
    cursor:pointer; font-size: 13.5px; transition: all .15s ease;
  }
  .opt:hover{ border-color: rgba(139,92,246,0.5); }
  .opt.disabled{ pointer-events:none; opacity:0.45; }
  .opt.chosen{ border-color: var(--violet); background: linear-gradient(120deg, rgba(139,92,246,0.2), rgba(34,211,238,0.12)); opacity:1; }
  .opt .ic{ font-size:16px; }
  .opt-visual{ flex-direction:column; gap:6px; }
  .opt-visual span:last-child{ font-size:11.5px; text-align:center; }

  .note{
    font-family:'JetBrains Mono', monospace; font-size:12px; line-height:1.6;
    color: var(--ink-soft); background: rgba(255,255,255,0.03);
    border-left: 2px solid var(--cyan); border-radius: 4px 8px 8px 4px;
    padding: 10px 12px; margin-top:10px;
  }

  .ready-block{
    margin-top:10px; padding:14px; border-radius:12px; border:1px solid var(--violet);
    background: linear-gradient(120deg, rgba(139,92,246,0.1), rgba(34,211,238,0.06));
  }
  .result-label{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--cyan); margin-bottom:8px; }
  .btn{
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:13.5px;
    padding: 10px 16px; border-radius:10px; cursor:pointer; border:none;
    display:inline-flex; align-items:center; gap:6px; margin-top:8px; margin-right:6px;
  }
  .btn.primary{ background: var(--grad); color:#0A0B14; }
  .btn.ghost{ background:transparent; border:1px solid var(--panel-border); color:var(--ink); }
  .btn.quick{ background: linear-gradient(120deg, var(--cyan), var(--violet)); color:#0A0B14; }
  .btn:disabled{ opacity:0.5; }

  details.prompt-toggle{ margin-top:12px; }
  details.prompt-toggle summary{ cursor:pointer; color:var(--ink-soft); font-size:12px; font-family:'JetBrains Mono',monospace; }
  .prompt-box{
    margin-top:8px; background: rgba(255,255,255,0.03); border:1px solid var(--panel-border);
    border-radius:10px; padding:12px; font-family:'JetBrains Mono',monospace; font-size:13px; line-height:1.6;
    white-space:pre-wrap;
  }
  .prompt-box .var{ color:var(--cyan); background:rgba(34,211,238,0.14); padding:1px 4px; border-radius:3px; }

  .dest-list{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .dest{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding: 9px 11px; border-radius:10px; border:1px solid var(--panel-border);
    background: rgba(255,255,255,0.025); text-decoration:none; color:var(--ink); font-size:13px;
  }
  .dest:hover{ border-color: var(--violet); }
  .dest .dname{ font-weight:600; }
  .dest .dnote{ font-size:11px; color:var(--ink-soft); }

  .pending-attachments{ display:flex; flex-wrap:wrap; gap:6px; padding: 0 16px; }
  .pending-chip{
    display:flex; align-items:center; gap:6px; background: rgba(255,255,255,0.05);
    border:1px solid var(--panel-border); border-radius:100px; padding:4px 8px 4px 4px; font-size:11.5px; color:var(--ink-soft);
  }
  .pending-chip img{ width:20px; height:20px; border-radius:50%; object-fit:cover; }
  .pending-chip button{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:11px; }

  .input-bar{
    flex-shrink:0; display:flex; align-items:flex-end; gap:8px;
    padding: 12px 16px 16px; border-top:1px solid var(--panel-border);
  }
  .input-bar textarea{
    flex:1; resize:none; max-height:120px; min-height:44px;
    font-family:'Inter', sans-serif; font-size:14.5px; color:var(--ink);
    background: rgba(255,255,255,0.04); border:1px solid var(--panel-border);
    border-radius: 14px; padding:11px 14px; outline:none;
  }
  .input-bar textarea:focus{ border-color: var(--violet); }
  .icon-btn{
    width:44px; height:44px; border-radius:50%; border:1px solid var(--panel-border);
    background: rgba(255,255,255,0.04); color:var(--ink); cursor:pointer; font-size:18px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .icon-btn.send{ background: var(--grad); color:#0A0B14; border:none; }
  .icon-btn:disabled{ opacity:0.4; }
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <img src="/logo.svg" alt="Diz Direito">
    <div class="brand-actions">
      <button class="subscribe-btn" id="subscribeBtn" onclick="assinarPlano()">⭐ Assinar</button>
      <button class="new-chat-btn" id="newChatBtn">🔄 Nova conversa</button>
    </div>
  </div>
  <div class="chat-log" id="chatLog"></div>
  <div class="pending-attachments" id="pendingAttachments"></div>
  <div class="input-bar">
    <button class="icon-btn" id="attachBtn" title="Anexar arquivo">📎</button>
    <input type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx" multiple style="display:none;">

    <button class="icon-btn send" id="sendBtn" title="Enviar">➤</button>

</div>

<script>
const chatState = {
  messages: [],
  stage: 'idle', // idle | questions | attachment | busy
  projectInput: '', projectType: '', outputType: 'texto', isResume: false,
  questions: [], qIndex: 0, answers: {},
  requiresAttachment: false, attachmentLabel: '',
  attachments: [], pendingAttachments: [],
  finalPrompt: ''
};
let msgCounter = 0;
function nextId(){ return 'm' + (++msgCounter); }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function highlightVars(t){ return esc(t).replace(/\[([^\]]+)\]/g, '<span class="var">[$1]</span>'); }

function getDeviceId(){
  let id = localStorage.getItem('dizDireitoDeviceId');
  if(!id){ id = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('dizDireitoDeviceId', id); }
  return id;
}

async function apiPost(path, body){
  const response = await fetch(path, { method:'POST', headers:{ 'Content-Type':'application/json', 'x-device-id':getDeviceId() }, body: JSON.stringify(body) });
  if(response.status === 429){ const err = await response.json(); const e = new Error(err.message||'Limite atingido'); e.quotaExceeded = true; throw e; }
  if(!response.ok) throw new Error('Erro no servidor');
  return response.json();
}

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function randomImageSeed(){ return Math.floor(Math.random() * 2147483647); }

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 2000);
}

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    try{
      const ta = document.createElement('textarea'); ta.value = text;
      ta.style.position='fixed'; ta.style.left='-9999px';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand('copy'); document.body.removeChild(ta);
      return ok;
    }catch(e2){ return false; }
  }
}

function layoutPreviewSVG(kind){
  const page = '<rect x="1" y="1" width="38" height="50" rx="2" fill="var(--panel)" stroke="var(--panel-border)" stroke-width="1"/>';
  const lines = (x,y,w) => `<rect x="${x}" y="${y}" width="${w}" height="2.4" rx="1" fill="var(--ink-soft)" opacity="0.55"/>`;
  let inner = '';
  if(kind==='foto-topo') inner = `<circle cx="20" cy="12" r="6" fill="var(--violet)"/>${lines(8,23,24)}${lines(6,29,28)}${lines(6,35,20)}${lines(6,41,24)}`;
  else if(kind==='foto-lateral') inner = `<circle cx="9" cy="12" r="5" fill="var(--violet)"/>${lines(17,9,18)}${lines(17,14,14)}${lines(5,24,30)}${lines(5,30,30)}${lines(5,36,22)}${lines(5,42,26)}`;
  else if(kind==='sem-foto') inner = `${lines(6,8,28)}${lines(6,14,20)}${lines(6,22,28)}${lines(6,28,24)}${lines(6,34,28)}${lines(6,40,18)}`;
  else if(kind==='foto-canto') inner = `<circle cx="31" cy="10" r="5" fill="var(--violet)"/>${lines(6,8,18)}${lines(6,14,14)}${lines(6,24,30)}${lines(6,30,30)}${lines(6,36,22)}${lines(6,42,26)}`;
  return `<svg width="40" height="52" viewBox="0 0 40 52">${page}${inner}</svg>`;
}
const LAYOUT_CURRICULO_QUESTION = {
  id:'layout_curriculo', label:'Qual estilo de layout você prefere?',
  options:[
    { label:'Foto no topo, centralizada', svg: layoutPreviewSVG('foto-topo') },
    { label:'Foto lateral à esquerda', svg: layoutPreviewSVG('foto-lateral') },
    { label:'Sem foto, só texto', svg: layoutPreviewSVG('sem-foto') },
    { label:'Foto no canto superior', svg: layoutPreviewSVG('foto-canto') }
  ]
};

function getQuickAction(payload){
  const text = (payload.projectType + ' ' + payload.projectInput).toLowerCase();
  const has = (...words) => words.some(w => text.includes(w));
  if(payload.attachments.length > 0 && has('fundo','background')) return { type:'link', icon:'🖼️', label:'Trocar o fundo mantendo sua foto real (remove.bg)', url:'https://www.remove.bg/upload' };
  if(has('linkedin')) return { type:'link', icon:'💼', label:'Abrir LinkedIn e atualizar sua foto', url:'https://www.linkedin.com/in/me/' };
  if(has('instagram','reels','stories','story','reel')) return { type:'link', icon:'📸', label:'Abrir Instagram para postar', url:'https://www.instagram.com/' };
  return null;
}

function suggestDestinations(payload){
  const text = (payload.projectType + ' ' + payload.projectInput).toLowerCase();
  const has = (...words) => words.some(w => text.includes(w));
  if(payload.outputType === 'imagem' || has('foto','imagem','design','logo','ilustra','arte','capa','banner','thumbnail')){
    return [
      { name:'Midjourney', icon:'🎨', note:'Melhor qualidade estética geral', url:'https://www.midjourney.com/' },
      { name:'Ideogram', icon:'🖼️', note:'Ótimo com texto dentro da imagem', url:'https://ideogram.ai/' },
      { name:'ChatGPT (imagens)', icon:'✨', note:'Fácil de usar, direto do navegador', url:'https://chatgpt.com/' },
      { name:'Leonardo AI', icon:'🎭', note:'Bom para estilos artísticos variados', url:'https://leonardo.ai/' }
    ];
  }
  if(has('vídeo','video','reels','tiktok','animação','animacao')){
    return [
      { name:'Runway', icon:'🎬', note:'Geração e edição de vídeo com IA', url:'https://runwayml.com/' },
      { name:'Pika', icon:'🎞️', note:'Rápido pra clipes curtos', url:'https://pika.art/' },
      { name:'Sora (OpenAI)', icon:'🌀', note:'Vídeos mais longos e realistas', url:'https://openai.com/sora' }
    ];
  }
  if(has('código','codigo','programação','programacao','script','python','javascript','app','api')){
    return [
      { name:'Claude', icon:'🤖', note:'Ótimo pra código e explicações claras', url:'https://claude.ai/' },
      { name:'ChatGPT', icon:'💬', note:'Boa opção alternativa', url:'https://chatgpt.com/' },
      { name:'GitHub Copilot', icon:'🧩', note:'Direto no seu editor de código', url:'https://github.com/features/copilot' }
    ];
  }
  return [
    { name:'Claude', icon:'🤖', note:'Ótimo pra textos com nuance e contexto', url:'https://claude.ai/' },
    { name:'ChatGPT', icon:'💬', note:'Rápido e bem conhecido', url:'https://chatgpt.com/' },
    { name:'Gemini', icon:'♊', note:'Boa opção integrada ao Google', url:'https://gemini.google.com/' }

}

function downloadResumePDF(data, filename){
  try{
    if(!window.jspdf || !window.jspdf.jsPDF) throw new Error('jsPDF indisponível');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:'a4' });
    const margin = 50, maxWidth = 495, pageBottom = 780;
    let y = margin;
    const checkBreak = (needed) => { if(y + needed > pageBottom){ doc.addPage(); y = margin; } };
    doc.setFont('Helvetica','bold'); doc.setFontSize(22); doc.setTextColor(20,20,20);
    doc.text(data.name || '[Seu nome]', margin, y); y += 26;
    if(data.title){ doc.setFont('Helvetica','normal'); doc.setFontSize(13); doc.setTextColor(90,90,90); doc.text(data.title, margin, y); y += 18; }
    if(data.contact){ doc.setFontSize(10); doc.setTextColor(120,120,120); doc.text(data.contact, margin, y); y += 20; }
    doc.setDrawColor(180,180,180); doc.line(margin, y, margin+maxWidth, y); y += 18;
    const sectionHeader = (title) => {
      checkBreak(24); doc.setFont('Helvetica','bold'); doc.setFontSize(12); doc.setTextColor(30,30,30);
      doc.text(title.toUpperCase(), margin, y); y += 6;
      doc.setDrawColor(210,210,210); doc.line(margin, y, margin+maxWidth, y); y += 14;
    };
    if(data.summary){
      sectionHeader('Resumo');
      doc.setFont('Helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(50,50,50);
      doc.splitTextToSize(data.summary, maxWidth).forEach(line=>{ checkBreak(14); doc.text(line, margin, y); y += 14; });
      y += 8;
    }
    if(Array.isArray(data.experience) && data.experience.length){
      sectionHeader('Experiência');
      data.experience.forEach(expx=>{
        checkBreak(18);
        doc.setFont('Helvetica','bold'); doc.setFontSize(11); doc.setTextColor(20,20,20);
        doc.text(expx.role||'', margin, y);
        if(expx.period){ doc.setFont('Helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(120,120,120); doc.text(expx.period, margin+maxWidth, y, {align:'right'}); }
        y += 14;
        if(expx.company){ doc.setFont('Helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90,90,90); doc.text(expx.company, margin, y); y += 14; }
        (expx.bullets||[]).forEach(b=>{
          doc.splitTextToSize('• '+b, maxWidth-10).forEach(line=>{ checkBreak(13); doc.setFont('Helvetica','normal'); doc.setFontSize(10); doc.setTextColor(50,50,50); doc.text(line, margin+8, y); y += 13; });
        });
        y += 8;
      });
    }
    if(Array.isArray(data.education) && data.education.length){
      sectionHeader('Formação');
      data.education.forEach(edu=>{
        checkBreak(16);
        doc.setFont('Helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(20,20,20);
        doc.text(edu.degree||'', margin, y);
        if(edu.period){ doc.setFont('Helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(120,120,120); doc.text(edu.period, margin+maxWidth, y, {align:'right'}); }
        y += 13;
        if(edu.institution){ doc.setFont('Helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90,90,90); doc.text(edu.institution, margin, y); y += 16; }
      });
    }
    if(Array.isArray(data.skills) && data.skills.length){
      sectionHeader('Habilidades');
      doc.setFont('Helvetica','normal'); doc.setFontSize(10); doc.setTextColor(50,50,50);
      doc.splitTextToSize(data.skills.join('  •  '), maxWidth).forEach(line=>{ checkBreak(14); doc.text(line, margin, y); y += 14; });
    }
    doc.save(filename);
  }catch(e){
    const plain = [data.name, data.title, data.contact, '', data.summary, '', 'EXPERIÊNCIA',
      ...(data.experience||[]).flatMap(x => [`${x.role} — ${x.company} (${x.period})`, ...(x.bullets||[]).map(b=>'• '+b), '']),
      'FORMAÇÃO', ...(data.education||[]).map(x=>`${x.degree} — ${x.institution} (${x.period})`),
      '', 'HABILIDADES', (data.skills||[]).join(', ')
    ].join('\n');
    downloadBlob(new Blob([plain], {type:'text/plain;charset=utf-8'}), filename.replace(/\.pdf$/i,'.txt'));
  }
}

function downloadTextAsPDF(text, filename){
  try{
    if(!window.jspdf || !window.jspdf.jsPDF) throw new Error('jsPDF indisponível');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:'a4' });
    const margin = 48, maxWidth = 500, pageBottom = 780;
    let y = margin;
    const checkBreak = (needed) => { if(y + needed > pageBottom){ doc.addPage(); y = margin; } };
    const stripInline = (s) => s.replace(/\*\*(.*?)\*\*/g,'$1').replace(/__(.*?)__/g,'$1').replace(/\*(.*?)\*/g,'$1').replace(/`(.*?)`/g,'$1');
    text.split('\n').forEach(raw=>{
      const trimmed = raw.trim();
      if(trimmed===''){ y += 8; return; }
      if(/^-{3,}$/.test(trimmed)){ checkBreak(10); doc.setDrawColor(200,200,200); doc.line(margin,y,margin+maxWidth,y); y += 12; return; }
      if(/^\|?[\s:-]+\|[\s:|-]+$/.test(trimmed)) return;
      const h3 = trimmed.match(/^###\s+(.*)/), h2 = trimmed.match(/^##\s+(.*)/), h1 = trimmed.match(/^#\s+(.*)/);
      const bullet = trimmed.match(/^[-*]\s+(.*)/);
      const tableRow = trimmed.match(/^\|(.+)\|$/);
      if(h1||h2||h3){
        const content = stripInline((h1||h2||h3)[1]);
        checkBreak(26); doc.setFont('Helvetica','bold'); doc.setFontSize(h1?16:h2?13.5:12); doc.setTextColor(20,20,20);
        doc.splitTextToSize(content, maxWidth).forEach(l=>{ checkBreak(18); doc.text(l, margin, y); y += (h1?20:17); });
        y += 4; return;
      }
      if(tableRow){
        const cells = tableRow[1].split('|').map(c=>stripInline(c.trim())).filter((c,i,arr)=> !(arr.every(x=>/^:?-+:?$/.test(x))));
        doc.setFont('Courier','normal'); doc.setFontSize(9); doc.setTextColor(50,50,50);
        doc.splitTextToSize(cells.join('   |   '), maxWidth).forEach(l=>{ checkBreak(13); doc.text(l, margin, y); y += 12; });
        return;
      }
      if(bullet){
        doc.setFont('Helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(40,40,40);
        doc.splitTextToSize('•  '+stripInline(bullet[1]), maxWidth-10).forEach(l=>{ checkBreak(14); doc.text(l, margin+6, y); y += 14; });
        return;
      }
      doc.setFont('Helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(40,40,40);
      doc.splitTextToSize(stripInline(trimmed), maxWidth).forEach(l=>{ checkBreak(14); doc.text(l, margin, y); y += 14; });
    });
    doc.save(filename);
  }catch(e){
    downloadBlob(new Blob([text], {type:'text/plain;charset=utf-8'}), filename.replace(/\.pdf$/i,'.txt'));
  }
}

async function downloadImageFile(url, filename){
  try{
    const response = await fetch(url, { mode:'cors' });
    if(!response.ok) throw new Error('falha');
    downloadBlob(await response.blob(), filename);
    return true;
  }catch(e){ return false; }
}

// ---------- Renderização do chat ----------
const chatLog = document.getElementById('chatLog');

function addMessage(msg){
  msg.id = msg.id || nextId();
  chatState.messages.push(msg);
  renderChat();
  return msg.id;
}
function removeMessage(id){
  chatState.messages = chatState.messages.filter(m => m.id !== id);
  renderChat();
}
function updateMessage(id, patch){
  const m = chatState.messages.find(x => x.id === id);
  if(m) Object.assign(m, patch);
  renderChat();
}

function renderChat(){
  chatLog.innerHTML = chatState.messages.map(renderMessage).join('');
  chatLog.scrollTop = chatLog.scrollHeight;
}

function renderMessage(m){
  const avatar = m.role === 'assistant' ? `<img class="avatar" src="/pug-real.png" alt="Diz Direito">` : '';
  let inner = '';

  if(m.kind === 'text'){
    inner = `<div class="bubble">${esc(m.text).replace(/\n/g,'<br>')}</div>`;
  } else if(m.kind === 'typing'){
    inner = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  } else if(m.kind === 'options'){
    const q = m.question;
    const optsHtml = q.options.map(o => `
      <div class="opt${o.svg?' opt-visual':''}${m.answered ? (m.chosenLabel===o.label?' chosen':' disabled') : ''}"
           data-action="choose-option" data-msgid="${m.id}" data-label="${esc(o.label)}">
        ${o.svg ? `<span>${o.svg}</span>` : `<span class="ic">${o.icon||'✨'}</span>`}<span>${esc(o.label)}</span>
      </div>`).join('');
    inner = `<div class="bubble wide"><div>${esc(q.label)}</div><div class="opt-grid">${optsHtml}</div></div>`;
  } else if(m.kind === 'result'){
    inner = `<div class="bubble wide">${renderResultPayload(m)}</div>`;
  } else if(m.kind === 'attachments'){
    inner = `<div class="bubble">${m.files.map(f => f.kind==='image'
      ? `<img src="data:${f.mime};base64,${f.base64}" style="width:60px;height:60px;border-radius:8px;object-fit:cover;margin:2px;">`
      : `<span style="display:inline-block;margin:2px;">📎 ${esc(f.name)}</span>`).join('')}</div>`;
  }

  return `<div class="msg-row ${m.role}">${m.role==='assistant'?avatar:''}${inner}</div>`;
}

function renderResultPayload(m){
  const p = m.payload;
  const hasExecuted = !!(p.executedResult || p.executedImageUrl || p.resumeData);
  const quickAction = getQuickAction(p);
  let readyHtml = '';

  if(p.outputType === 'imagem'){
    const hasPhotoRef = p.attachments.some(a => a.kind==='image');
    readyHtml = `<div class="ready-block">
      <div class="result-label">resultado diz direito</div>
      ${hasPhotoRef ? `<div class="note">⚠️ Você anexou uma foto, mas o gerador gratuito não usa a foto real — ele cria uma imagem nova a partir de uma descrição em texto. Pra manter sua foto de verdade, veja a sugestão abaixo ou envie a foto direto pro ChatGPT/Gemini.</div>` : ''}
      ${p.executedImageUrl ? `
        <img src="${p.executedImageUrl}" alt="Resultado gerado" style="width:100%;border-radius:12px;border:1px solid var(--panel-border);margin-top:8px;" onerror="this.style.display='none';document.getElementById('imgerr-${m.id}').style.display='block';">
        <div class="note" id="imgerr-${m.id}" style="display:none;">A geração de imagem gratuita falhou dessa vez (é um serviço de terceiros). <span style="text-decoration:underline;cursor:pointer;color:var(--cyan);" data-action="retry-image" data-msgid="${m.id}">Tentar de novo</span></div>
        <button class="btn ghost" data-action="download-image" data-msgid="${m.id}">⬇️ Baixar imagem</button>
      ` : '<div class="note">Não consegui gerar a imagem agora.</div>'}
    </div>`;
  } else if(p.isResume && p.resumeData){
    readyHtml = `<div class="ready-block">
      <div class="result-label">currículo pronto</div>
      <p style="margin:0 0 8px;font-size:13.5px;color:var(--ink-soft);">Seu currículo já foi gerado e formatado.</p>
      <button class="btn primary" data-action="download-resume" data-msgid="${m.id}">📄 Baixar currículo em PDF</button>
    </div>`;
  } else if(p.executedResult){
    readyHtml = `<div class="ready-block">
      <div class="result-label">resultado pronto</div>
      <p style="margin:0 0 8px;font-size:13.5px;color:var(--ink-soft);">Seu resultado já foi gerado.</p>
      <button class="btn primary" data-action="download-text" data-msgid="${m.id}">⬇️ Baixar resultado em PDF</button>
    </div>`;
  } else {
    readyHtml = '<div class="note">Não consegui gerar o resultado agora — o prompt abaixo ainda funciona se você colar em outra IA.</div>';
  }

  const quickHtml = quickAction ? `<button class="btn quick" data-action="quick-action" data-msgid="${m.id}">${quickAction.icon} ${esc(quickAction.label)}</button><br>` : '';
  const destHtml = suggestDestinations(p).map(d => `
    <a class="dest" href="${d.url}" target="_blank" rel="noopener"><div><div class="dname">${d.icon} ${esc(d.name)}</div><div class="dnote">${esc(d.note)}</div></div>↗</a>
  `).join('');

  return `
    🎉 <strong>Projeto concluído!</strong>
    ${readyHtml}
    <details class="prompt-toggle"><summary>ver o prompt original</summary>
      <div class="prompt-box">${highlightVars(p.finalPrompt)}</div>
      <button class="btn ghost" data-action="copy-prompt" data-msgid="${m.id}">Copiar prompt</button>
    </details>
    ${p.attachments.length ? '<div class="note">📎 A IA analisou seu(s) anexo(s) pra deixar esse resultado específico pra eles.</div>' : ''}
    ${quickHtml}
    <div class="dest-list">${destHtml}</div>
  `;
}

// ---------- Delegação de eventos ----------
chatLog.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const msgid = el.dataset.msgid;
  const msg = chatState.messages.find(m => m.id === msgid);

  if(action === 'choose-option'){
    if(msg.answered) return;
    const label = el.dataset.label;
    updateMessage(msgid, { answered:true, chosenLabel: label });
    addMessage({ role:'user', kind:'text', text: label });
    await answerQuestion(label);
  } else if(action === 'download-resume'){
    downloadResumePDF(msg.payload.resumeData, 'curriculo-diz-direito.pdf');
  } else if(action === 'download-text'){
    downloadTextAsPDF(msg.payload.executedResult, 'diz-direito-resultado.pdf');
  } else if(action === 'download-image'){
    const ok = await downloadImageFile(msg.payload.executedImageUrl, 'diz-direito-imagem.jpg');
    if(!ok) alert('Não consegui baixar automaticamente. Clique com o botão direito na imagem e escolha "Salvar imagem como...".');
  } else if(action === 'retry-image'){
    const encoded = encodeURIComponent(msg.payload.finalPrompt.slice(0,800));
    msg.payload.executedImageUrl = `https://image.pollinations.ai/prompt/${encoded}?width=1024&height=1024&nologo=true&seed=${randomImageSeed()}`;
    renderChat();
  } else if(action === 'quick-action'){
    const qa = getQuickAction(msg.payload);
    if(qa) window.open(qa.url, '_blank', 'noopener');
  } else if(action === 'copy-prompt'){
    const ok = await copyText(msg.payload.finalPrompt);
    el.textContent = ok ? 'Copiado! ✓' : 'Selecione e copie manualmente';
    setTimeout(()=>{ el.textContent = 'Copiar prompt'; }, 1600);
  }
});

// ---------- Fluxo da conversa ----------
function greet(){
  addMessage({ role:'assistant', kind:'text', text:'Oi! Me conta o que você quer criar — pode ser um currículo, uma foto pro Instagram, um texto, um código, o que for. Também dá pra anexar uma referência com o clipe 📎 aqui embaixo.' });
}

async function beginProject(text){
  chatState.projectInput = text;
  chatState.stage = 'busy';
  const typingId = addMessage({ role:'assistant', kind:'typing' });
  try{
    const json = await apiPost('/api/questions', { projectInput: text });
    removeMessage(typingId);
    chatState.projectType = json.project_type || 'projeto';
    chatState.outputType = json.output_type === 'imagem' ? 'imagem' : 'texto';
    chatState.requiresAttachment = !!json.requires_attachment && chatState.attachments.length === 0;
    chatState.attachmentLabel = json.attachment_label || 'Anexe um arquivo de referência';
    chatState.questions = json.questions || [];
    const isCurriculo = /curr[íi]culo|resume|\bcv\b/i.test(chatState.projectType + ' ' + text);
    chatState.isResume = isCurriculo;
    if(isCurriculo){
      chatState.outputType = 'texto';
      if(!chatState.questions.some(q=>q.id==='layout_curriculo')) chatState.questions.push(LAYOUT_CURRICULO_QUESTION);
    }
    chatState.qIndex = 0;
    chatState.answers = {};
    if(chatState.questions.length === 0){ await finalizeProject(); return; }
    postCurrentQuestion();
    chatState.stage = 'questions';
  }catch(e){
    removeMessage(typingId);
    addMessage({ role:'assistant', kind:'text', text: e.quotaExceeded ? e.message : 'Não consegui entender, tenta descrever de outro jeito.' });
    chatState.stage = 'idle';
  }
}

function postCurrentQuestion(){
  const q = chatState.questions[chatState.qIndex];
  addMessage({ role:'assistant', kind:'options', question: q, answered:false });
}

async function answerQuestion(answerText){
  const q = chatState.questions[chatState.qIndex];
  chatState.answers[q.id] = answerText;
  chatState.qIndex++;
  if(chatState.qIndex < chatState.questions.length){
    postCurrentQuestion();
  } else if(chatState.requiresAttachment && chatState.attachments.length === 0){
    chatState.stage = 'attachment';
    addMessage({ role:'assistant', kind:'text', text: chatState.attachmentLabel + ' (use o clipe 📎 aqui embaixo e depois mande qualquer mensagem pra continuar)' });
  } else {
    await finalizeProject();
  }
}

async function finalizeProject(){
  chatState.stage = 'busy';
  const typingId = addMessage({ role:'assistant', kind:'typing' });
  try{
    const json = await apiPost('/api/final-prompt', {
      projectInput: chatState.projectInput,
      questions: chatState.questions,
      answers: chatState.answers,
      attachments: chatState.attachments.length ? chatState.attachments.map(a=>({base64:a.base64, mime:a.mime})) : undefined
    });
    chatState.finalPrompt = json.finalPrompt;

    let executedResult = '', executedImageUrl = '', resumeData = null;
    if(chatState.outputType === 'imagem'){
      const encoded = encodeURIComponent(chatState.finalPrompt.slice(0,800));
      executedImageUrl = `https://image.pollinations.ai/prompt/${encoded}?width=1024&height=1024&nologo=true&seed=${randomImageSeed()}`;
    } else if(chatState.isResume){
      const r = await apiPost('/api/execute-resume', { finalPrompt: chatState.finalPrompt });
      resumeData = r.resumeData;
    } else {
      const r = await apiPost('/api/execute-text', { finalPrompt: chatState.finalPrompt });
      executedResult = r.result;
    }

    removeMessage(typingId);
    addMessage({
      role:'assistant', kind:'result',
      payload:{
        projectInput: chatState.projectInput, projectType: chatState.projectType,
        outputType: chatState.outputType, isResume: chatState.isResume,
        finalPrompt: chatState.finalPrompt, executedResult, executedImageUrl, resumeData,
        attachments: chatState.attachments.slice()
      }
    });
  }catch(e){
    removeMessage(typingId);
    addMessage({ role:'assistant', kind:'text', text:'Não consegui gerar o resultado agora. Tenta de novo?' });
  }
  // reseta pra um novo projeto, mantendo o histórico visível no chat
  chatState.projectInput=''; chatState.questions=[]; chatState.qIndex=0; chatState.answers={};
  chatState.requiresAttachment=false; chatState.attachments=[]; chatState.finalPrompt=''; chatState.isResume=false;
  chatState.stage = 'idle';
  addMessage({ role:'assistant', kind:'text', text:'Quer criar outro projeto? É só me contar o que você precisa.' });
}

// ---------- Input bar ----------
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const attachBtn = document.getElementById('attachBtn');
const fileInput = document.getElementById('fileInput');
const pendingAttachmentsEl = document.getElementById('pendingAttachments');

chatInput.addEventListener('input', ()=>{
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
});
chatInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); handleSend(); }
});
sendBtn.addEventListener('click', handleSend);
attachBtn.addEventListener('click', ()=> fileInput.click());

fileInput.addEventListener('change', async ()=>{
  for(const file of fileInput.files){
    const base64 = await fileToBase64(file);
    const kind = file.type.startsWith('image/') ? 'image' : (file.type==='application/pdf' ? 'pdf' : 'other');
    chatState.pendingAttachments.push({ base64, mime:file.type, name:file.name, kind });
  }
  fileInput.value = '';
  renderPendingAttachments();
});

function renderPendingAttachments(){
  pendingAttachmentsEl.innerHTML = chatState.pendingAttachments.map((a,i)=>`
    <div class="pending-chip">
      ${a.kind==='image' ? `<img src="data:${a.mime};base64,${a.base64}">` : (a.kind==='pdf'?'📄':'📎')}
      <span>${esc(a.name)}</span>
      <button data-idx="${i}">✕</button>
    </div>`).join('');
  pendingAttachmentsEl.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{ chatState.pendingAttachments.splice(+btn.dataset.idx,1); renderPendingAttachments(); });
  });
}

async function handleSend(){
  const text = chatInput.value.trim();
  const attachmentsToSend = chatState.pendingAttachments.slice();
  if(!text && attachmentsToSend.length === 0) return;
  if(chatState.stage === 'busy') return;

  chatInput.value = ''; chatInput.style.height = 'auto';
  chatState.pendingAttachments = []; renderPendingAttachments();

  if(attachmentsToSend.length){
    addMessage({ role:'user', kind:'attachments', files: attachmentsToSend });
    chatState.attachments.push(...attachmentsToSend);
  }
  if(text) addMessage({ role:'user', kind:'text', text });

  if(chatState.stage === 'idle'){
    if(text) await beginProject(text);
  } else if(chatState.stage === 'questions'){
    if(text) await answerQuestion(text);
  } else if(chatState.stage === 'attachment'){
    await finalizeProject();
  }
}

document.getElementById('newChatBtn').addEventListener('click', ()=>{
  chatState.messages = [];
  chatState.stage = 'idle';
  chatState.projectInput=''; chatState.questions=[]; chatState.qIndex=0; chatState.answers={};
  chatState.requiresAttachment=false; chatState.attachments=[]; chatState.finalPrompt=''; chatState.isResume=false;
  greet();
});

greet();
