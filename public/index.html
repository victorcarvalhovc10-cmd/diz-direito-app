<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diz Direito — assistente de projetos com IA</title>
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A0B14">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg: #0A0B14;
    --bg2: #10121F;
    --panel: rgba(255,255,255,0.045);
    --panel-border: rgba(255,255,255,0.09);
    --ink: #EDEBF7;
    --ink-soft: #9491AD;
    --violet: #8B5CF6;
    --cyan: #22D3EE;
    --pink: #F472B6;
    --grad: linear-gradient(120deg, var(--violet), var(--cyan));
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(139,92,246,0.16), transparent 45%),
      radial-gradient(circle at 85% 20%, rgba(34,211,238,0.12), transparent 40%),
      var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    display:flex;
    justify-content:center;
    padding: 40px 18px 80px;
  }

  .mascot-wrap{
    display:flex; justify-content:center; margin: 6px 0 28px;
    position: relative;
  }
  .mascot-track{
    width: 230px; height: 195px; position: relative;
  }
  .pug-face{
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
  }
  .pug-eye{
    animation: blink 4.5s ease-in-out infinite;
    transform-origin: center;
    transform-box: fill-box;
  }
  .pug-eye.eye-b{ animation-delay: 0.05s; }
  @keyframes blink{
    0%, 92%, 100%{ transform: scaleY(1); }
    95%{ transform: scaleY(0.1); }
  }
  .idea-bulb{
    position:absolute; top:-18px; left:50%; transform:translateX(-50%);
    opacity:0; animation: idea-cycle 7s ease-in-out infinite;
  }
  @keyframes idea-cycle{
    0%, 8%{ opacity:0; transform:translateX(-50%) translateY(4px) scale(0.8); }
    18%, 42%{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
    52%, 100%{ opacity:0; transform:translateX(-50%) translateY(4px) scale(0.8); }
  }
  .thought-bubble{
    position:absolute; top:-12px; left:50%; transform:translateX(56px);
    opacity:0; animation: thought-cycle 7s ease-in-out infinite;
    background: var(--panel); border:1px solid var(--panel-border);
    border-radius: 10px; padding:6px 10px; white-space:nowrap;
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft);
    backdrop-filter: blur(8px);
  }
  @keyframes thought-cycle{
    0%, 55%{ opacity:0; transform:translateX(56px) translateY(4px); }
    65%, 90%{ opacity:1; transform:translateX(56px) translateY(0); }
    98%, 100%{ opacity:0; transform:translateX(56px) translateY(4px); }
  }

  .app{ width:100%; max-width: 560px; }

  .brand{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    flex-wrap: wrap;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600; font-size:15px;
    color: var(--ink-soft);
    margin-bottom: 30px;
  }
  .brand .logo{ display:flex; align-items:center; gap:10px; }
  .brand .dot{ width:8px; height:8px; border-radius:50%; background: var(--grad); box-shadow: 0 0 12px var(--violet); }
  .hist-btn{
    font-family:'JetBrains Mono', monospace; font-size:12px;
    background: none; border: 1px solid var(--panel-border); color: var(--ink-soft);
    padding: 7px 12px; border-radius: 100px; cursor:pointer;
    display:flex; align-items:center; gap:6px;
  }
  .hist-btn:hover{ border-color: var(--violet); color: var(--ink); }
  .hist-btn .badge{
    background: var(--grad); color:#0A0B14; font-size:10.5px; font-weight:700;
    border-radius:100px; padding:1px 6px;
  }

  .hist-item{
    padding: 14px; border-radius: 12px; border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.025); margin-bottom:10px; cursor:pointer;
    transition: all .15s ease;
  }
  .hist-item:hover{ border-color: var(--violet); }
  .hist-item .htype{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14px; margin-bottom:4px; }
  .hist-item .hpreview{ font-size:12.5px; color: var(--ink-soft); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .hist-item .htime{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color:#5F5C77; margin-top:6px; }
  .hist-empty{ color: var(--ink-soft); font-size:14px; text-align:center; padding: 40px 10px; }

  /* progress trail */
  .trail{
    display:flex; align-items:center; gap:6px;
    margin-bottom: 30px;
  }
  .trail .seg{
    flex:1; height:4px; border-radius:4px;
    background: rgba(255,255,255,0.08);
    overflow:hidden;
  }
  .trail .seg .fill{
    height:100%; width:0%; background: var(--grad);
    transition: width .5s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 0 8px var(--violet);
  }
  .trail .seg.done .fill{ width:100%; }
  .trail .seg.current .fill{ width:55%; }

  .card{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(18px);
    border-radius: 20px;
    padding: 32px 28px;
    min-height: 360px;
    display:flex; flex-direction:column;
    animation: rise .4s cubic-bezier(.16,1,.3,1);
  }
  @keyframes rise{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .kicker{
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px; letter-spacing:.1em; text-transform:uppercase;
    color: var(--cyan);
    margin-bottom: 10px;
  }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-size: 27px; font-weight:700; line-height:1.15;
    margin: 0 0 8px;
  }
  h1 span{ background: var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }

  .hint{ color: var(--ink-soft); font-size: 14.5px; line-height:1.5; margin-bottom:22px; }

  textarea, input[type=text]{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size: 15px;
    padding: 15px 16px;
    border-radius: 12px;
    border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.03);
    color: var(--ink);
    outline:none;
    resize: vertical;
  }
  textarea{ min-height: 96px; }
  textarea:focus, input[type=text]:focus{ border-color: var(--violet); box-shadow: 0 0 0 3px rgba(139,92,246,0.18); }
  textarea::placeholder, input::placeholder{ color:#5F5C77; }

  .options{
    display:grid; grid-template-columns: 1fr 1fr; gap:10px;
    margin-top: 4px;
  }
  .opt{
    display:flex; align-items:center; gap:9px;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.025);
    cursor:pointer;
    font-size: 14px;
    transition: all .15s ease;
  }
  .opt .ic{ font-size: 18px; }
  .opt:hover{ border-color: rgba(139,92,246,0.5); }
  .opt.sel{
    border-color: var(--violet);
    background: linear-gradient(120deg, rgba(139,92,246,0.18), rgba(34,211,238,0.1));
    box-shadow: 0 0 0 1px var(--violet), 0 0 20px rgba(139,92,246,0.25);
  }
  .opt.custom{ grid-column: 1 / -1; }
  .opt-visual{ flex-direction:column; align-items:flex-start; gap:8px; padding:10px; }
  .opt-visual .ic-visual{ align-self:center; }
  .opt-visual .ic-visual svg{ display:block; }
  .opt-visual span:last-child{ font-size:12.5px; text-align:center; width:100%; }

  .grow{ flex:1; }

  .nav{ display:flex; justify-content:space-between; align-items:center; margin-top:24px; }

  button.next, button.start{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600; font-size: 14.5px;
    background: var(--grad);
    color: #0A0B14;
    border:none; padding: 13px 24px; border-radius: 11px;
    cursor:pointer;
    display:flex; align-items:center; gap:8px;
    transition: transform .12s ease, filter .15s ease;
  }
  button.next:hover, button.start:hover{ filter: brightness(1.08); }
  button.next:active, button.start:active{ transform: scale(0.97); }
  button.next:disabled{ opacity:.4; cursor:default; }

  button.back{
    background:none; border:none; color: var(--ink-soft);
    font-family:'Inter', sans-serif; font-size:14px; cursor:pointer;
  }
  button.back:hover{ color: var(--ink); }

  .spinner{
    width:15px; height:15px; border-radius:50%;
    border: 2px solid rgba(10,11,20,0.25); border-top-color:#0A0B14;
    animation: spin .7s linear infinite; display:none;
  }
  .loading .spinner{ display:inline-block; }
  @keyframes spin{ to{ transform: rotate(360deg);} }

  .error{ color: var(--pink); font-size:13.5px; margin-top:12px; display:none; }
  .error.show{ display:block; }

  /* result screen */
  .quick-action{
    background: linear-gradient(120deg, var(--cyan), var(--violet));
  }

  .ready-block{
    margin-bottom: 16px;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid var(--violet);
    background: linear-gradient(120deg, rgba(139,92,246,0.08), rgba(34,211,238,0.05));
  }

  .executed-section{
    margin-bottom: 16px;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--violet);
    background: linear-gradient(120deg, rgba(139,92,246,0.08), rgba(34,211,238,0.05));
  }

  .result-badge{
    align-self:flex-start;
    font-family:'JetBrains Mono', monospace; font-size:11.5px;
    color:#0A0B14; background: var(--grad);
    padding:5px 12px; border-radius: 100px; margin-bottom:16px;
  }
  .output{
    font-family:'JetBrains Mono', monospace; font-size:14px; line-height:1.7;
    white-space: pre-wrap;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 18px;
    flex:1;
    outline: none;
  }
  .output:focus{ border-color: var(--violet); box-shadow: 0 0 0 3px rgba(139,92,246,0.14); }
  .output .var{
    color: var(--cyan); background: rgba(34,211,238,0.14);
    padding:1px 4px; border-radius:3px;
    border-bottom: 1px dashed var(--cyan);
  }
  .edit-hint{ font-size:12px; color: var(--ink-soft); margin-top:8px; }

  .result-actions{ display:flex; gap:10px; margin-top:16px; }
  button.ghost{
    font-family:'Space Grotesk', sans-serif; font-size:13.5px;
    background: transparent; border:1px solid var(--panel-border); color: var(--ink);
    padding:11px 18px; border-radius:10px; cursor:pointer;
  }
  button.ghost:hover{ border-color: var(--violet); }

  .dropzone-compact{
    padding: 14px 16px;
    display:flex; flex-direction:row; align-items:center; gap:10px;
    margin-top: 14px;
    text-align:left;
  }
  .dropzone-compact .ic{ font-size:18px; margin-bottom:0; }
  .dropzone-compact .label{ font-size:13px; }
  .attach-chips{
    display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;
  }
  .attach-chip{
    display:flex; align-items:center; gap:6px;
    background: rgba(255,255,255,0.04); border:1px solid var(--panel-border);
    border-radius: 100px; padding: 4px 10px 4px 4px;
  }
  .attach-chip img{ width:24px; height:24px; border-radius:50%; object-fit:cover; }
  .attach-chip-file{ font-size:16px; width:24px; text-align:center; }
  .attach-chip-name{ font-size:12px; color: var(--ink-soft); max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .attach-chip-remove{
    background:none; border:none; color: var(--ink-soft); cursor:pointer; font-size:12px; padding:2px;
  }
  .attach-chip-remove:hover{ color: var(--pink); }

  .dropzone{
    border: 1.5px dashed var(--panel-border);
    border-radius: 14px;
    padding: 30px 18px;
    text-align:center;
    cursor:pointer;
    background: rgba(255,255,255,0.02);
    transition: all .15s ease;
  }
  .dropzone:hover, .dropzone.drag{ border-color: var(--violet); background: rgba(139,92,246,0.06); }
  .dropzone .ic{ font-size: 30px; display:block; margin-bottom:10px; }
  .dropzone .label{ font-size:14px; color: var(--ink-soft); }
  .dropzone input{ display:none; }
  .preview{ margin-top:16px; display:flex; align-items:center; gap:12px; }
  .preview img{ width:64px; height:64px; object-fit:cover; border-radius:10px; border:1px solid var(--panel-border); }
  .preview .name{ font-size:13px; color: var(--ink-soft); }
  .note{
    font-family:'JetBrains Mono', monospace; font-size:12.5px; line-height:1.6;
    color: var(--ink-soft); background: rgba(255,255,255,0.03);
    border-left: 2px solid var(--cyan); border-radius: 4px 10px 10px 4px;
    padding: 12px 14px; margin-top:14px;
  }

  .destinations{ margin-top:18px; }
  .destinations .dlabel{
    font-family:'JetBrains Mono', monospace; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase;
    color: var(--ink-soft); margin-bottom:10px;
  }
  .dest-list{ display:flex; flex-direction:column; gap:8px; }
  .dest{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.025);
    text-decoration:none; color: var(--ink);
    transition: all .15s ease;
  }
  .dest:hover{ border-color: var(--violet); background: rgba(139,92,246,0.08); }
  .dest .dname{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px; }
  .dest .dnote{ font-size:12px; color: var(--ink-soft); margin-top:2px; }
  .dest .arrow{ color: var(--cyan); font-size:16px; }

  footer{
    text-align:center; margin-top:26px;
    font-family:'JetBrains Mono', monospace; font-size:11.5px; color: #514F68;
  }
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <div class="logo"><img src="/logo.svg" alt="Diz Direito" style="height:150px;width:auto;max-width:100%;"></div>
    <button class="hist-btn" id="histBtn">🕘 Histórico <span class="badge" id="histBadge" style="display:none;">0</span></button>
  </div>
  <div class="trail" id="trail"></div>
  <div class="card" id="card"><!-- injected --></div>
  <footer>protótipo de validação · powered by IA</footer>
</div>

<script>
const state = { screen: 'start', projectInput: '', projectType: '', outputType: 'texto', isResume: false, questions: [], stepIndex: 0, answers: {}, finalPrompt: '', requiresAttachment: false, attachmentLabel: '', attachments: [], history: [], executedResult: '', executedImageUrl: '', resumeData: null };

const cardEl = document.getElementById('card');
const trailEl = document.getElementById('trail');
const histBtn = document.getElementById('histBtn');
const histBadge = document.getElementById('histBadge');

function updateHistBadge(){
  if(state.history.length > 0){
    histBadge.style.display = 'inline';
    histBadge.textContent = state.history.length;
  }else{
    histBadge.style.display = 'none';
  }
}

histBtn.addEventListener('click', renderHistory);

function renderHistory(){
  state.screen = 'history';
  trailEl.innerHTML = '';
  const items = state.history;
  cardEl.innerHTML = `
    <div class="kicker">seus projetos</div>
    <h1>Histórico</h1>
    <p class="hint">Projetos gerados nesta sessão. Fecha se você recarregar a página.</p>
    ${items.length === 0 ? '<div class="hist-empty">Nenhum projeto ainda. Crie o primeiro!</div>' : items.map((h,i)=>`
      <div class="hist-item" data-idx="${i}">
        <div class="htype">${esc(h.projectType)}</div>
        <div class="hpreview">${esc(h.prompt.slice(0,140))}${h.prompt.length>140?'…':''}</div>
        <div class="htime">${h.time}</div>
      </div>
    `).join('')}
    <div class="grow"></div>
    <div class="nav">
      <button class="back" id="histBack">← voltar</button>
      <span></span>
    </div>
  `;
  cardEl.querySelectorAll('.hist-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const h = state.history[+el.dataset.idx];
      state.projectType = h.projectType;
      state.finalPrompt = h.prompt;
      state.outputType = h.outputType || 'texto';
      state.isResume = h.isResume || false;
      state.executedResult = h.executedResult || '';
      state.executedImageUrl = h.executedImageUrl || '';
      state.resumeData = h.resumeData || null;
      state.attachments = h.hadAttachment ? state.attachments : [];
      state.projectInput = h.projectInput;
      renderResult();
    });
  });
  document.getElementById('histBack').addEventListener('click', ()=>{
    if(state.finalPrompt) renderResult(); else renderStart();
  });
}

function renderTrail(){
  const extra = state.requiresAttachment ? 1 : 0;
  const total = Math.max(state.questions.length + extra, 1);
  let html = '';
  for(let i=0;i<total;i++){
    let cls = 'seg';
    if(state.screen==='result') cls += ' done';
    else if(i < state.stepIndex) cls += ' done';
    else if(i === state.stepIndex && (state.screen==='question' || state.screen==='attachment')) cls += ' current';
    html += `<div class="${cls}"><div class="fill"></div></div>`;
  }
  trailEl.innerHTML = state.questions.length ? html : '';
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function highlightVars(t){ return esc(t).replace(/\[([^\]]+)\]/g, '<span class="var">[$1]</span>'); }

function getDeviceId(){
  let id = localStorage.getItem('dizDireitoDeviceId');
  if(!id){
    id = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem('dizDireitoDeviceId', id);
  }
  return id;
}

async function apiPost(path, body){
  const response = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-device-id': getDeviceId() },
    body: JSON.stringify(body)
  });
  if(response.status === 429){
    const err = await response.json();
    const e = new Error(err.message || 'Limite atingido');
    e.quotaExceeded = true;
    throw e;
  }
  if(!response.ok){
    throw new Error('Erro no servidor');
  }
  return response.json();
}

function renderStartAttachChips(){
  const el = document.getElementById('startAttachChips');
  if(!el) return;
  el.innerHTML = state.attachments.map((a, i) => `
    <div class="attach-chip">
      ${a.kind === 'image'
        ? `<img src="data:${a.mime};base64,${a.base64}" alt="${esc(a.name)}">`
        : `<span class="attach-chip-file">${a.kind === 'pdf' ? '📄' : '📎'}</span>`
      }
      <span class="attach-chip-name">${esc(a.name)}</span>
      <button type="button" class="attach-chip-remove" data-idx="${i}">✕</button>
    </div>
  `).join('');
  el.querySelectorAll('.attach-chip-remove').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.attachments.splice(+btn.dataset.idx, 1);
      renderStartAttachChips();
    });
  });
}

function renderStart(){
  state.screen = 'start';
  renderTrail();
  cardEl.innerHTML = `
    <div class="mascot-wrap">
      <div class="mascot-track">
        <div class="idea-bulb">
          <svg width="26" height="34" viewBox="0 0 26 34" fill="none">
            <circle cx="13" cy="13" r="11" fill="#FCD34D"/>
            <rect x="9" y="23" width="8" height="5" rx="1.5" fill="#9491AD"/>
            <rect x="10" y="29" width="6" height="3" rx="1" fill="#6B6885"/>
            <path d="M13 6v5M9 9l2 2M17 9l-2 2" stroke="#B45309" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="thought-bubble" id="pugThought">Vamos criar algo incrível!</div>
        <div class="pug-face">
          <svg width="210" height="153" viewBox="0 0 460 335" fill="none">
            <defs>
              <radialGradient id="faceGrad" cx="45%" cy="35%" r="70%">
                <stop offset="0%" stop-color="#E8CBA0"/>
                <stop offset="100%" stop-color="#D2A874"/>
              </radialGradient>
            </defs>
            <g transform="translate(100,10)">
              <path d="M40 70c-30-38-95-30-98 18-3 42 38 68 82 58z" fill="#2B2019"/>
              <path d="M46 78c-20-24-62-18-63 12-2 27 24 44 53 37z" fill="#3E2E22"/>
              <path d="M260 66c32-36 96-24 96 24 0 42-40 66-84 54z" fill="#2B2019"/>
              <path d="M255 74c22-22 63-14 62 15-1 26-27 42-56 34z" fill="#3E2E22"/>
              <ellipse cx="150" cy="170" rx="150" ry="145" fill="url(#faceGrad)"/>
              <path d="M62 100c22-20 55-30 88-30s66 10 88 30" stroke="#BB8F5E" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.55"/>
              <path d="M50 130c26-16 62-24 100-24s74 8 100 24" stroke="#BB8F5E" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.4"/>
              <path d="M120 92c8 18 6 40-4 58M180 92c-8 18-6 40 4 58" stroke="#BB8F5E" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
              <path d="M150 95c-46 0-76 34-84 70-9 40 8 78 44 96 24 12 56 12 80 0 36-18 53-56 44-96-8-36-38-70-84-70z" fill="#241a14"/>

async function startFlow(){
  const val = document.getElementById('startInput').value.trim();
  const errEl = document.getElementById('startError');
  const btn = document.getElementById('startBtn');
  if(!val){ errEl.classList.add('show'); return; }
  errEl.classList.remove('show');
  state.projectInput = val;
  btn.disabled = true; btn.classList.add('loading');

  try{
    const json = await apiPost('/api/questions', { projectInput: val });
    state.projectType = json.project_type || 'projeto';
    state.questions = json.questions || [];
    state.requiresAttachment = !!json.requires_attachment && state.attachments.length === 0;
    state.outputType = json.output_type === 'imagem' ? 'imagem' : 'texto';
    state.attachmentLabel = json.attachment_label || 'Anexe um arquivo de referência';

    // se o projeto for currículo, garante uma pergunta visual de layout e força saída como texto/PDF
    const isCurriculo = /curr[íi]culo|resume|\bcv\b/i.test(state.projectType + ' ' + val);
    state.isResume = isCurriculo;
    if(isCurriculo){
      state.outputType = 'texto'; // currículo nunca deve ser roteado pra geração de imagem
      if(!state.questions.some(q => q.id === 'layout_curriculo')){
        state.questions.push(LAYOUT_CURRICULO_QUESTION);
      }
    }

    state.stepIndex = 0;
    state.answers = {};
    if(state.questions.length === 0) throw new Error('sem perguntas');
    renderQuestion();
  }catch(e){
    btn.disabled = false; btn.classList.remove('loading');
    errEl.textContent = e.quotaExceeded ? e.message : 'Não consegui entender, tenta descrever de outro jeito.';
    errEl.classList.add('show');
  }
}

  let inner = '';
  if(kind === 'foto-topo'){
    inner = `<circle cx="20" cy="12" r="6" fill="var(--violet)"/>${lines(8,23,24)}${lines(6,29,28)}${lines(6,35,20)}${lines(6,41,24)}`;
  }else if(kind === 'foto-lateral'){
    inner = `<circle cx="9" cy="12" r="5" fill="var(--violet)"/>${lines(17,9,18)}${lines(17,14,14)}${lines(5,24,30)}${lines(5,30,30)}${lines(5,36,22)}${lines(5,42,26)}`;
  }else if(kind === 'sem-foto'){
    inner = `${lines(6,8,28)}${lines(6,14,20)}${lines(6,22,28)}${lines(6,28,24)}${lines(6,34,28)}${lines(6,40,18)}`;

function renderQuestion(){
  state.screen = 'question';
  renderTrail();
  const q = state.questions[state.stepIndex];
  const total = state.questions.length;
  const current = state.answers[q.id] || null;

  let optsHtml = q.options.map((o,i) => `
    <div class="opt${o.svg ? ' opt-visual' : ''}${current===o.label?' sel':''}" data-label="${esc(o.label)}">
      ${o.svg ? `<span class="ic-visual">${o.svg}</span>` : `<span class="ic">${o.icon||'✨'}</span>`}<span>${esc(o.label)}</span>
    </div>
  `).join('');

  cardEl.innerHTML = `
    <div class="kicker">passo ${state.stepIndex+2} de ${total+2} — ${esc(state.projectType)}</div>
    <h1>${esc(q.label)}</h1>
    <p class="hint">Escolhe a opção que mais combina, ou descreve com suas palavras.</p>
    <div class="options">
      ${optsHtml}
      <div class="opt custom" id="customOpt">
        <span class="ic">✏️</span><input type="text" id="customInput" placeholder="Outro... (digite aqui)">
      </div>
    </div>
    <div class="grow"></div>
    <div class="nav">
      <button class="back" id="backBtn">${state.stepIndex===0 ? '← voltar ao início' : '← voltar'}</button>
      <button class="next" id="nextBtn" ${current?'':'disabled'}><span class="spinner"></span><span>${state.stepIndex===total-1?(state.requiresAttachment?'Próxima':'Ver resultado'):'Próxima'}</span></button>
    </div>
  `;

  cardEl.querySelectorAll('.opt:not(.custom)').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.answers[q.id] = el.dataset.label;
      document.getElementById('customInput').value = '';
      renderQuestion();
    });
  });

  const customInput = document.getElementById('customInput');
  customInput.addEventListener('input', ()=>{
    const v = customInput.value.trim();
    state.answers[q.id] = v || null;
    document.getElementById('nextBtn').disabled = !v;
    cardEl.querySelectorAll('.opt:not(.custom)').forEach(o=>o.classList.remove('sel'));
  });

  document.getElementById('backBtn').addEventListener('click', ()=>{
    if(state.stepIndex===0){ renderStart(); }
    else{ state.stepIndex--; renderQuestion(); }
  });

  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(state.stepIndex < total-1){
      state.stepIndex++;
      renderQuestion();
    }else if(state.requiresAttachment){
      state.stepIndex++;
      renderAttachment();
    }else{
      generateFinal();
    }
  });
}

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function downloadResumePDF(data, filename){
  try{
    if(!window.jspdf || !window.jspdf.jsPDF) throw new Error('jsPDF indisponível');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:'a4' });
    const margin = 50;
    const maxWidth = 495;
    const pageBottom = 780;
    let y = margin;

    const checkBreak = (needed) => { if(y + needed > pageBottom){ doc.addPage(); y = margin; } };

    doc.setFont('Helvetica','bold'); doc.setFontSize(22); doc.setTextColor(20,20,20);
    doc.text(data.name || '[Seu nome]', margin, y); y += 26;

    if(data.title){
      doc.setFont('Helvetica','normal'); doc.setFontSize(13); doc.setTextColor(90,90,90);
      doc.text(data.title, margin, y); y += 18;
    }
    if(data.contact){
      doc.setFontSize(10); doc.setTextColor(120,120,120);
      doc.text(data.contact, margin, y); y += 20;
    }
    doc.setDrawColor(180,180,180); doc.line(margin, y, margin+maxWidth, y); y += 18;

    const sectionHeader = (title) => {
      checkBreak(24);
      doc.setFont('Helvetica','bold'); doc.setFontSize(12); doc.setTextColor(30,30,30);
      doc.text(title.toUpperCase(), margin, y); y += 6;
      doc.setDrawColor(210,210,210); doc.line(margin, y, margin+maxWidth, y); y += 14;
    };

    if(data.summary){
      sectionHeader('Resumo');
      doc.setFont('Helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(50,50,50);
      const lines = doc.splitTextToSize(data.summary, maxWidth);
      lines.forEach(line=>{ checkBreak(14); doc.text(line, margin, y); y += 14; });
      y += 8;
    }

    if(Array.isArray(data.experience) && data.experience.length){
      sectionHeader('Experiência');
      data.experience.forEach(exp=>{
        checkBreak(18);
        doc.setFont('Helvetica','bold'); doc.setFontSize(11); doc.setTextColor(20,20,20);
        doc.text(exp.role || '', margin, y);
        if(exp.period){
          doc.setFont('Helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(120,120,120);
          doc.text(exp.period, margin+maxWidth, y, { align:'right' });
        }
        y += 14;
        if(exp.company){
          doc.setFont('Helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90,90,90);
          doc.text(exp.company, margin, y); y += 14;
        }
        (exp.bullets||[]).forEach(b=>{
          const lines = doc.splitTextToSize('• ' + b, maxWidth-10);
          lines.forEach(line=>{
            checkBreak(13);
            doc.setFont('Helvetica','normal'); doc.setFontSize(10); doc.setTextColor(50,50,50);
            doc.text(line, margin+8, y); y += 13;
          });
        });
        y += 8;
      });
    }

    if(Array.isArray(data.education) && data.education.length){
      sectionHeader('Formação');
      data.education.forEach(edu=>{
        checkBreak(16);
        doc.setFont('Helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(20,20,20);
        doc.text(edu.degree || '', margin, y);
        if(edu.period){
          doc.setFont('Helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(120,120,120);
          doc.text(edu.period, margin+maxWidth, y, { align:'right' });
        }
        y += 13;
        if(edu.institution){
          doc.setFont('Helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90,90,90);
          doc.text(edu.institution, margin, y); y += 16;
        }
      });
    }

    if(Array.isArray(data.skills) && data.skills.length){
      sectionHeader('Habilidades');
      doc.setFont('Helvetica','normal'); doc.setFontSize(10); doc.setTextColor(50,50,50);
      const lines = doc.splitTextToSize(data.skills.join('  •  '), maxWidth);
      lines.forEach(line=>{ checkBreak(14); doc.text(line, margin, y); y += 14; });
    }

    doc.save(filename);
  }catch(e){
    const plain = [data.name, data.title, data.contact, '', data.summary, '', 'EXPERIÊNCIA',
      ...(data.experience||[]).flatMap(x => [`${x.role} — ${x.company} (${x.period})`, ...(x.bullets||[]).map(b=>'• '+b), '']),
      'FORMAÇÃO', ...(data.education||[]).map(x=>`${x.degree} — ${x.institution} (${x.period})`),
      '', 'HABILIDADES', (data.skills||[]).join(', ')
    ].join('\n');
    const blob = new Blob([plain], { type:'text/plain;charset=utf-8' });
    downloadBlob(blob, filename.replace(/\.pdf$/i,'.txt'));
  }
}

function randomImageSeed(){
  return Math.floor(Math.random() * 2147483647);

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 2000);
}

function downloadTextAsPDF(text, filename){
  try{
    if(!window.jspdf || !window.jspdf.jsPDF) throw new Error('jsPDF indisponível');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:'a4' });
    const margin = 48;
    const maxWidth = 500;
    const pageBottom = 780;
    let y = margin;

    const checkBreak = (needed) => { if(y + needed > pageBottom){ doc.addPage(); y = margin; } };
    const stripInline = (s) => s.replace(/\*\*(.*?)\*\*/g, '$1').replace(/__(.*?)__/g, '$1').replace(/\*(.*?)\*/g, '$1').replace(/`(.*?)`/g, '$1');

    const paragraphs = text.split('\n');
    paragraphs.forEach(raw=>{
      const line = raw.trimEnd();
      const trimmed = line.trim();

      if(trimmed === '' ){ y += 8; return; }
      if(/^-{3,}$/.test(trimmed)){ checkBreak(10); doc.setDrawColor(200,200,200); doc.line(margin,y,margin+maxWidth,y); y += 12; return; }
      if(/^\|?[\s:-]+\|[\s:|-]+$/.test(trimmed)) return; // separador de tabela markdown, ignora

      const h3 = trimmed.match(/^###\s+(.*)/);
      const h2 = trimmed.match(/^##\s+(.*)/);
      const h1 = trimmed.match(/^#\s+(.*)/);
      const bullet = trimmed.match(/^[-*]\s+(.*)/);
      const tableRow = trimmed.match(/^\|(.+)\|$/);

      if(h1 || h2 || h3){
        const content = stripInline((h1||h2||h3)[1]);
        checkBreak(26);
        doc.setFont('Helvetica','bold');
        doc.setFontSize(h1 ? 16 : h2 ? 13.5 : 12);
        doc.setTextColor(20,20,20);
        const lines = doc.splitTextToSize(content, maxWidth);
        lines.forEach(l=>{ checkBreak(18); doc.text(l, margin, y); y += (h1?20:17); });
        y += 4;
        return;
      }

      if(tableRow){
        const cells = tableRow[1].split('|').map(c => stripInline(c.trim())).filter((c,i,arr)=> !(arr.every(x=>/^:?-+:?$/.test(x))));
        const rowText = cells.join('   |   ');
        doc.setFont('Courier','normal'); doc.setFontSize(9); doc.setTextColor(50,50,50);
        const lines = doc.splitTextToSize(rowText, maxWidth);
        lines.forEach(l=>{ checkBreak(13); doc.text(l, margin, y); y += 12; });
        return;
      }

      if(bullet){
        const content = stripInline(bullet[1]);
        doc.setFont('Helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(40,40,40);
        const lines = doc.splitTextToSize('•  ' + content, maxWidth-10);
        lines.forEach(l=>{ checkBreak(14); doc.text(l, margin+6, y); y += 14; });
        return;
      }

      // parágrafo normal
      const content = stripInline(trimmed);
      doc.setFont('Helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(40,40,40);
      const lines = doc.splitTextToSize(content, maxWidth);
      lines.forEach(l=>{ checkBreak(14); doc.text(l, margin, y); y += 14; });
    });

    doc.save(filename);
  }catch(e){
    const txtBlob = new Blob([text], { type:'text/plain;charset=utf-8' });
    downloadBlob(txtBlob, filename.replace(/\.pdf$/i, '.txt'));
  }
}

async function downloadImageFile(url, filename){
  try{
    const response = await fetch(url, { mode:'cors' });
    if(!response.ok) throw new Error('falha ao buscar imagem');
    const blob = await response.blob();
    downloadBlob(blob, filename);
    return true;
  }catch(e){
    return false;
  }
}

      { name: 'Claude', icon:'🤖', note: 'Ótimo pra código e explicações claras', url: 'https://claude.ai/' },
      { name: 'ChatGPT', icon:'💬', note: 'Boa opção alternativa', url: 'https://chatgpt.com/' },
      { name: 'GitHub Copilot', icon:'🧩', note: 'Direto no seu editor de código', url: 'https://github.com/features/copilot' }
    ];
  }
  return [
    { name: 'Claude', icon:'🤖', note: 'Ótimo pra textos com nuance e contexto', url: 'https://claude.ai/' },
    { name: 'ChatGPT', icon:'💬', note: 'Rápido e bem conhecido', url: 'https://chatgpt.com/' },
    { name: 'Gemini', icon:'♊', note: 'Boa opção integrada ao Google', url: 'https://gemini.google.com/' }
  ];
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }catch(e2){
      return false;
    }
  }
}

async function executeResult(){
  state.executedResult = '';
  state.executedImageUrl = '';
  state.resumeData = null;
  try{
    if(state.outputType === 'imagem'){
      const encoded = encodeURIComponent(state.finalPrompt.slice(0, 800));
      state.executedImageUrl = `https://image.pollinations.ai/prompt/${encoded}?width=1024&height=1024&nologo=true&seed=${randomImageSeed()}`;
    }else if(state.isResume){
      const json = await apiPost('/api/execute-resume', { finalPrompt: state.finalPrompt });
      state.resumeData = json.resumeData;
    }else{
      const json = await apiPost('/api/execute-text', { finalPrompt: state.finalPrompt });
      state.executedResult = json.result;
    }
  }catch(e){
    // se falhar, o app ainda mostra o prompt normalmente como plano B
  }
  state.history.unshift({
    projectType: state.projectType,
    projectInput: state.projectInput,
    prompt: state.finalPrompt,
    outputType: state.outputType,
    isResume: state.isResume,
    executedResult: state.executedResult,
    executedImageUrl: state.executedImageUrl,
    resumeData: state.resumeData,
    hadAttachment: state.attachments.length > 0,
    time: new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})
  });
  if(state.history.length > 10) state.history.pop();
  updateHistBadge();
  renderResult();
}

function renderResult(){
  state.screen = 'result';
  renderTrail();

  const hasExecuted = !!(state.executedResult || state.executedImageUrl || state.resumeData);
  const quickAction = getQuickAction();
  const quickActionHtml = (quickAction && !state.isResume) ? `
    <div class="result-actions">
      <button class="next quick-action" id="quickActionBtn">${quickAction.icon} ${esc(quickAction.label)}</button>
    </div>
  ` : '';

  let readyBlockHtml = '';
  if(state.outputType === 'imagem'){
    const hasPhotoRef = state.attachments.some(a => a.kind === 'image' || (a.mime||'').startsWith('image/'));
    readyBlockHtml = `
      <div class="ready-block">
        <div class="result-label">resultado diz direito</div>
        ${hasPhotoRef ? `<div class="note" style="margin-bottom:12px;">⚠️ Você anexou uma foto, mas o gerador gratuito não usa a foto real — ele cria uma imagem nova a partir de uma descrição em texto que a IA fez dela, então o rosto pode sair diferente. Pra manter sua foto de verdade, veja a sugestão abaixo ou envie a foto direto pro ChatGPT/Gemini.</div>` : ''}
        ${state.executedImageUrl ? `
          <img src="${state.executedImageUrl}" alt="Resultado gerado" id="resultImg"
               style="width:100%;border-radius:12px;border:1px solid var(--panel-border);">
          <div class="note" id="imgErrorNote" style="display:none;">A geração de imagem gratuita falhou dessa vez (isso pode acontecer, é um serviço de terceiros). <span id="retryImgBtn" style="text-decoration:underline;cursor:pointer;color:var(--cyan);">Tentar de novo</span></div>
          <div class="result-actions"><button class="ghost" id="downloadBtn">⬇️ Baixar imagem</button></div>
        ` : '<div class="note">Não consegui gerar a imagem agora — tenta de novo em alguns segundos.</div>'}
      </div>`;
  }else if(state.isResume && state.resumeData){
    readyBlockHtml = `
      <div class="ready-block">
        <div class="result-label">currículo pronto</div>
        <p class="hint" style="margin-bottom:14px;">Seu currículo já foi gerado e formatado. Baixe o PDF pronto pra usar.</p>
        <div class="result-actions"><button class="next" id="downloadBtn">📄 Baixar currículo em PDF</button></div>
      </div>`;
  }else if(state.executedResult){
    readyBlockHtml = `
      <div class="ready-block">
        <div class="result-label">resultado pronto</div>
        <p class="hint" style="margin-bottom:14px;">Seu resultado já foi gerado. Baixe o arquivo pronto pra usar.</p>
        <div class="result-actions"><button class="next" id="downloadBtn">⬇️ Baixar resultado em PDF</button></div>
      </div>`;
  }else{
    readyBlockHtml = '<div class="note">Não consegui gerar o resultado agora — o prompt abaixo ainda funciona se você colar em outra IA.</div>';
  }

  cardEl.innerHTML = `
    <div class="result-badge">🎉 projeto concluído</div>
    <h1>${state.isResume ? 'Seu currículo tá' : (state.outputType === 'imagem' ? 'Sua imagem tá' : 'Seu resultado tá')} <span>pronto</span>.</h1>
    <p class="hint">Confira abaixo, ou copie o prompt original pra usar em outro lugar. Os campos em destaque são pra você personalizar.</p>

    ${readyBlockHtml}

    <details style="margin-top:16px;">
      <summary style="cursor:pointer;color:var(--ink-soft);font-size:13px;font-family:'JetBrains Mono',monospace;">ver o prompt original</summary>
      <div class="output" id="outputText" contenteditable="true" spellcheck="false" style="margin-top:10px;"></div>
      <div class="edit-hint">💡 clique no texto acima pra editar antes de copiar</div>
    </details>
    ${state.attachments.length > 0 ? '<div class="note">📎 A IA analisou seu(s) anexo(s) pra deixar esse resultado específico pra eles.</div>' : ''}
    ${quickActionHtml}
    <div class="result-actions">
      <button class="ghost" id="copyBtn">Copiar prompt</button>
      <button class="ghost" id="restartBtn">Criar outro projeto</button>
    </div>
    <div class="destinations">
      <div class="dlabel">onde usar esse prompt</div>
      <div class="dest-list">
        ${suggestDestinations().map(d => `
          <a class="dest" href="${d.url}" target="_blank" rel="noopener">
            <div>
              <div class="dname">${d.icon} ${esc(d.name)}</div>
              <div class="dnote">${esc(d.note)}</div>
            </div>
            <span class="arrow">↗</span>
          </a>
        `).join('')}
      </div>
    </div>
  `;
  document.getElementById('outputText').innerHTML = highlightVars(state.finalPrompt);

  const resultImg = document.getElementById('resultImg');
  if(resultImg){
    resultImg.addEventListener('error', ()=>{
      resultImg.style.display = 'none';
      document.getElementById('imgErrorNote').style.display = 'block';
    });
    const retryBtn = document.getElementById('retryImgBtn');
    if(retryBtn){
      retryBtn.addEventListener('click', async ()=>{
        const encoded = encodeURIComponent(state.finalPrompt.slice(0, 800));
        state.executedImageUrl = `https://image.pollinations.ai/prompt/${encoded}?width=1024&height=1024&nologo=true&seed=${randomImageSeed()}`;
        renderResult();
      });
    }
  }

  const downloadBtn = document.getElementById('downloadBtn');
  if(downloadBtn){
    downloadBtn.addEventListener('click', async ()=>{
      downloadBtn.disabled = true;
      const original = downloadBtn.innerHTML;
      downloadBtn.innerHTML = 'Baixando...';
      try{
        if(state.outputType === 'imagem' && state.executedImageUrl){
          const ok = await downloadImageFile(state.executedImageUrl, 'diz-direito-imagem.jpg');
          if(!ok){
            const note = document.getElementById('imgErrorNote');
            if(note){
              note.style.display = 'block';
              note.innerHTML = 'Não consegui baixar automaticamente. Clique com o botão direito na imagem acima e escolha "Salvar imagem como...".';
            }
          }
        }else if(state.isResume && state.resumeData){
          downloadResumePDF(state.resumeData, 'curriculo-diz-direito.pdf');
        }else if(state.executedResult){
          downloadTextAsPDF(state.executedResult, 'diz-direito-resultado.pdf');
        }
      }finally{
        downloadBtn.disabled = false;
        downloadBtn.innerHTML = original;
      }
    });
  }

  if(quickAction){
    document.getElementById('quickActionBtn').addEventListener('click', ()=>{
      window.open(quickAction.url, '_blank', 'noopener');
    });
  }

  document.getElementById('copyBtn').addEventListener('click', async ()=>{
    const outputEl = document.getElementById('outputText');
    const liveText = outputEl.innerText;
    const b = document.getElementById('copyBtn');
    const ok = await copyText(liveText);
    if(ok){
      b.innerHTML = '<span>Copiado! ✓</span>';
      setTimeout(()=>{ b.innerHTML = 'Copiar prompt'; }, 1600);
    }else{
      b.innerHTML = '<span>Selecionado — use Ctrl+C</span>';
      const range = document.createRange();
      range.selectNodeContents(outputEl);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      setTimeout(()=>{ b.innerHTML = 'Copiar prompt'; }, 2600);
    }
  });
  document.getElementById('restartBtn').addEventListener('click', ()=>{
    state.attachments = [];
    renderStart();
  });
}

renderStart();
</script>
